# pipeline_config.yaml
# Centralized config so table names / rules aren't hardcoded across layers.
# In production this might instead be env-specific (dev/stage/prod) and
# injected via Airflow Variables or a secrets manager.

raw_tables:
  - orders
  - customers
  - products

silver_rules:
  orders:
    drop_null_columns: ["order_id", "customer_id"]
    valid_status_values: ["COMPLETED", "CANCELLED"]
    min_quantity: 1          # rows with quantity < 1 are treated as bad records
  customers:
    dedupe_on: ["customer_id"]
  products:
    dedupe_on: ["product_id"]

gold_marts:
  - daily_sales_summary
  - customer_lifetime_value
  - top_products
